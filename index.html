<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Servidor Ultraviolet</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            background-color: #121212; 
            color: white; 
        }
        h1 { color: #ff6600; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #aaaaaa; margin-bottom: 30px; }
        .search-container { max-width: 600px; margin: 0 auto; }
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 30px;
            background-color: #1a1a1a;
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: #ff6600; }
    </style>
    <script src="uv.bundle.js" onerror="this.src='/dist/uv.bundle.js'" defer></script>
    <script src="uv.config.js" onerror="this.src='/dist/uv.config.js'" defer></script>
</head>
<body>

    <h1>¡Ultraviolet Desplegado con Éxito!</h1>
    <p>Introduce una URL para navegar de forma libre (ej: medal.tv):</p>

    <div class="search-container">
        <form id="uv-form">
            <input id="uv-address" type="text" placeholder="Escribe una dirección web y pulsa Enter..." autocomplete="off">
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('uv-form');
            const address = document.getElementById('uv-address');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if ('serviceWorker' in navigator) {
                    try {
                        await navigator.serviceWorker.register('uv.sw.js', { scope: __uv$config.prefix });
                    } catch(err) {
                        try {
                            await navigator.serviceWorker.register('/dist/uv.sw.js', { scope: __uv$config.prefix });
                        } catch(e2) {
                            console.error("No se pudo registrar", e2);
                        }
                    }
                }

                let url = address.value.trim();
                if (!url.includes('.') || url.includes(' ')) {
                    url = 'https://google.com' + encodeURIComponent(url);
                } else if (!/^https?:\/\//i.test(url)) {
                    url = 'https://' + url;
                }

                window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
            });
        });
    </script>
</body>
</html>
